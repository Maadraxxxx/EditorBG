<!-- Entrar, criar conta, trocar a senha e ver o plano.
     Injetado por js/conta-ui.js em qualquer pagina que importe o modulo. -->
<div class="modal" id="modalConta" hidden>
  <div class="hd-card conta-card">
    <button class="modal-close hd-fechar" id="contaFechar" aria-label="Fechar">✕</button>

    <div id="contaFormulario">
      <h2 id="contaTitulo">Entrar</h2>
      <p class="hd-sub" id="contaSub">Sua conta guarda o plano VIP.</p>

      <label class="ed-field">E-mail
        <input type="email" id="contaEmail" autocomplete="email" placeholder="voce@email.com" />
      </label>
      <!-- As duas confirmações só aparecem no cadastro: um e-mail digitado
           errado deixa a pessoa sem como recuperar a conta depois. -->
      <label class="ed-field" id="campoEmail2" hidden>Confirme o e-mail
        <input type="email" id="contaEmail2" autocomplete="off" placeholder="digite o mesmo e-mail" />
      </label>

      <label class="ed-field">Senha
        <input type="password" id="contaSenha" autocomplete="current-password" placeholder="mínimo 6 caracteres" />
      </label>
      <label class="ed-field" id="campoSenha2" hidden>Confirme a senha
        <input type="password" id="contaSenha2" autocomplete="new-password" placeholder="digite a mesma senha" />
      </label>

      <button class="btn primary full" id="contaEnviar">Entrar</button>
      <!-- Botão de verdade, do mesmo tamanho do de entrar. Em cinza porque as
           duas ações não competem: uma é a que quase todo mundo quer. -->
      <button type="button" class="btn ghost full" id="contaAlternar">Criar conta</button>
      <!-- Separador: o Google e o formulário são dois caminhos para a mesma
           coisa, e sem a linha eles parecem passos de uma sequência. -->
      <div class="conta-ou" id="contaOu"><span>ou</span></div>

      <!-- Botão branco com o G colorido: é como o Google pede que apareça, e é
           o que as pessoas reconhecem sem ler. -->
      <button type="button" class="btn-google full" id="contaGoogle">
        <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.33A9 9 0 0 0 9 18Z"/>
          <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.02-2.33Z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/>
        </svg>
        Continuar com Google
      </button>

      <p class="hd-aviso" id="contaAviso"></p>
      <p class="conta-troca">
        <button type="button" class="link-botao" id="contaEsqueci">Esqueci a senha</button>
      </p>
    </div>

    <!-- Aparece quando a pessoa chega pelo link de "esqueci a senha". -->
    <div id="contaRecuperar" hidden>
      <h2>Criar uma senha nova</h2>
      <p class="hd-sub">Você entrou pelo link do e-mail. Escolha a senha que vai usar daqui em diante.</p>

      <label class="ed-field">Nova senha
        <input type="password" id="contaSenhaNova" autocomplete="new-password" placeholder="mínimo 6 caracteres" />
      </label>
      <label class="ed-field">Repita a nova senha
        <input type="password" id="contaSenhaNova2" autocomplete="new-password" placeholder="digite a mesma senha" />
      </label>

      <button class="btn primary full" id="contaSalvarSenha">Salvar senha</button>

      <p class="hd-aviso" id="contaAvisoSenha"></p>
      <p class="conta-troca">
        <button type="button" class="link-botao" id="contaPularSenha">Agora não, continuar assim</button>
      </p>
    </div>

    <div id="contaLogada" hidden>
      <div class="conta-avatar" id="contaInicial">?</div>
      <h2 id="contaEmailLogado">—</h2>
      <p class="conta-plano" id="contaPlano">Plano grátis</p>
      <button class="btn primary full" id="contaVerVip">Conhecer o VIP</button>
      <!-- Só aparece para administradores. Esconder aqui é conforto, não
           seguranca: quem barra o acesso de verdade e a funcao api/admin.js. -->
      <a class="btn ghost full" id="contaPainel" href="/admin" hidden>Painel de controle</a>
      <button class="btn ghost full" id="contaSair">Sair da conta</button>
    </div>
  </div>
</div>
