<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar imagem online — recortar, redimensionar e ajustar cores</title>
  <meta name="description" content="Recorte com proporções fixas, defina largura e altura em pixels, ajuste brilho, contraste e saturação. Direto no navegador, sem instalar nada." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9998;</text></svg>" />
  <link rel="canonical" href="https://editorbg.com.br/editar" />

  <!-- Como o link aparece quando alguem compartilha no WhatsApp, no
       Facebook ou no X. Sem isto, sai um retangulo cinza sem titulo. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EditorBG" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:url" content="https://editorbg.com.br/editar" />
  <meta property="og:title" content="Editar imagem online — recortar, redimensionar e ajustar cores" />
  <meta property="og:description" content="Recorte com proporções fixas, defina largura e altura em pixels, ajuste brilho, contraste e saturação. Direto no navegador, sem instalar nada." />
  <meta property="og:image" content="https://editorbg.com.br/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-mode="editor">

<script type="module">
  // O editor ocupa a página inteira: injeta o markup e entrega o controle a editar.js.
  const html = await fetch('partials/editor').then((r) => r.text());
  document.body.insertAdjacentHTML('beforeend', html);
  await import('./js/editar.js');
</script>

</body>
</html>
